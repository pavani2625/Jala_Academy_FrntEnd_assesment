<!DOCTYPE html>
<html lang="en" ng-app="filterApp">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AngularJS Filters</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            padding: 20px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>

<body ng-controller="FilterController">

    <div class="container">

        <h1>AngularJS Filters</h1>

        <div class="card">

            <h2>Uppercase</h2>

            <p>{{ name | uppercase }}</p>

        </div>

        <div class="card">

            <h2>Lowercase</h2>

            <p>{{ name | lowercase }}</p>

        </div>

        <div class="card">

            <h2>Number</h2>

            <p>{{ salary | number:2 }}</p>

        </div>

        <div class="card">

            <h2>Date</h2>

            <p>{{ today | date:'dd-MM-yyyy' }}</p>

        </div>

        <div class="card">

            <h2>Custom Filter</h2>

            <p>{{ name | reverse }}</p>

        </div>

    </div>

</body>

</html>
