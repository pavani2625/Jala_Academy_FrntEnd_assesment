<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS List Style Type</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CSS List Style Types</h1>


        <div class="list-card">

            <h2>Disc</h2>

            <ul class="disc-list">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>AngularJS</li>
            </ul>

        </div>


        <div class="list-card">

            <h2>Circle</h2>

            <ul class="circle-list">
                <li>Java</li>
                <li>Spring Boot</li>
                <li>MySQL</li>
                <li>REST API</li>
            </ul>

        </div>


        <div class="list-card">

            <h2>Square</h2>

            <ul class="square-list">
                <li>React</li>
                <li>Node.js</li>
                <li>MongoDB</li>
                <li>Express</li>
            </ul>

        </div>


        <div class="list-card">

            <h2>Ordered — Lowercase Roman</h2>

            <ol class="roman-list">
                <li>Frontend</li>
                <li>Backend</li>
                <li>Database</li>
                <li>Deployment</li>
            </ol>

        </div>

    </div>

</body>

</html>
