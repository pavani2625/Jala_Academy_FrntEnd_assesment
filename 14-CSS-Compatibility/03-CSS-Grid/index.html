<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Grid Types</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>CSS Grid Layouts</h1>


        <!-- Type 1 -->

        <section>

            <h2>1. Equal Column Grid</h2>

            <div class="grid equal-grid">

                <div class="item">1</div>
                <div class="item">2</div>
                <div class="item">3</div>
                <div class="item">4</div>
                <div class="item">5</div>
                <div class="item">6</div>

            </div>

        </section>


        <!-- Type 2 -->

        <section>

            <h2>2. Two Column Grid</h2>

            <div class="grid two-column-grid">

                <div class="item">HTML</div>
                <div class="item">CSS</div>
                <div class="item">JavaScript</div>
                <div class="item">AngularJS</div>

            </div>

        </section>


        <!-- Type 3 -->

        <section>

            <h2>3. Responsive Grid</h2>

            <div class="grid responsive-grid">

                <div class="item">Java</div>
                <div class="item">Spring Boot</div>
                <div class="item">MySQL</div>
                <div class="item">REST API</div>
                <div class="item">Git</div>
                <div class="item">Docker</div>

            </div>

        </section>

    </div>

</body>

</html>
