<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Height and Width</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CSS Height and Width</h1>

        <div class="box pixel-box">
            <h2>Pixel Values</h2>
            <p>
                Width: 400px<br>
                Height: 200px
            </p>
        </div>

        <div class="percentage-container">

            <div class="box percentage-box">
                <h2>Percentage Values</h2>
                <p>
                    Width: 80%<br>
                    Height: 50%
                </p>
            </div>

        </div>

    </div>

</body>

</html>
