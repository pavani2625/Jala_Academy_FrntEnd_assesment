<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaScript Form Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 50px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 25px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Form Validation</h1>

        <form id="studentForm">

            <div class="form-group">

                <label for="name">
                    Name:
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name">

            </div>

            <button type="submit">
                Submit
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        const form =
            document.getElementById("studentForm");

        const nameInput =
            document.getElementById("name");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", function (event) {

            event.preventDefault();

            if (nameInput.value.trim() === "") {

                message.textContent =
                    "Name cannot be empty.";

                message.style.color = "red";

            } else {

                message.textContent =
                    "Form submitted successfully.";

                message.style.color = "green";

            }

        });

    </script>

</body>

</html>
