<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Table Hover</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Details</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>City</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>Razeena</td>
                    <td>Java Full Stack</td>
                    <td>Hyderabad</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Ayesha</td>
                    <td>Frontend</td>
                    <td>Hyderabad</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Rahul</td>
                    <td>Python</td>
                    <td>Bangalore</td>
                </tr>
            </tbody>
        </table>

        <p class="instruction">
            Move your mouse over the table.
        </p>

    </div>

</body>

</html>
