<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Visibility and Display</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CSS Visibility and Display</h1>

        <!-- Visibility -->
        <section>

            <h2>Visibility</h2>

            <p class="visible-box">
                visibility: visible
            </p>

            <p class="hidden-box">
                visibility: hidden
            </p>

            <p class="collapse-box">
                visibility: collapse
            </p>

        </section>

        <hr>

        <!-- Display -->
        <section>

            <h2>Display Properties</h2>

            <p class="none-box">
                display: none
            </p>

            <p class="inline-box">
                display: inline
            </p>

            <p class="block-box">
                display: block
            </p>

            <div class="contents-box">
                <span>display: contents - item 1</span>
                <span>display: contents - item 2</span>
            </div>

            <p class="list-item-box">
                display: list-item
            </p>

        </section>

    </div>

</body>

</html>
