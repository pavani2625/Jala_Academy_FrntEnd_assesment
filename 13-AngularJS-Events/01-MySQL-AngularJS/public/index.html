<!DOCTYPE html>
<html lang="en" ng-app="studentApp">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AngularJS MySQL Data</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

    <script src="app.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

    </style>

</head>


<body ng-controller="StudentController">

    <div class="container">

        <h1>Students from MySQL</h1>


        <button ng-click="loadStudents()">
            Load Students
        </button>


        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>City</th>

                </tr>

            </thead>


            <tbody>

                <tr ng-repeat="student in students">

                    <td>
                        {{ student.id }}
                    </td>

                    <td>
                        {{ student.name }}
                    </td>

                    <td>
                        {{ student.course }}
                    </td>

                    <td>
                        {{ student.city }}
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</body>

</html>
