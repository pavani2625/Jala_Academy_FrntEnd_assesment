<!DOCTYPE html>
<html lang="en" ng-app="domApp">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AngularJS DOM Events</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

    <script src="app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        .box {
            padding: 20px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            width: 90%;
        }

        button {
            padding: 10px 20px;
            margin: 8px 5px 8px 0;
            cursor: pointer;
        }

        .message {
            padding: 15px;
            margin-top: 15px;
            background-color: #e8f4ff;
        }
    </style>
</head>

<body ng-controller="DomController">

    <div class="container">

        <h1>AngularJS DOM</h1>


        <!-- Input -->

        <div class="box">

            <h2>Enter Your Name</h2>

            <input
                type="text"
                ng-model="name"
                placeholder="Enter your name">

        </div>


        <!-- ng-show -->

        <div class="box">

            <h2>ng-show</h2>

            <button ng-click="showMessage = true">
                Show Message
            </button>

            <button ng-click="showMessage = false">
                Hide Message
            </button>

            <div
                class="message"
                ng-show="showMessage">

                Hello {{ name || "Student" }}!
                This message is visible because
                ng-show is true.

            </div>

        </div>


        <!-- ng-hide -->

        <div class="box">

            <h2>ng-hide</h2>

            <button ng-click="hideMessage = true">
                Hide Content
            </button>

            <button ng-click="hideMessage = false">
                Show Content
            </button>

            <div
                class="message"
                ng-hide="hideMessage">

                This content is hidden when
                ng-hide is true.

            </div>

        </div>


        <!-- ng-disabled -->

        <div class="box">

            <h2>ng-disabled</h2>

            <label>

                <input
                    type="checkbox"
                    ng-model="disableButton">

                Disable button

            </label>

            <br>

            <button
                ng-disabled="disableButton">

                Click Me

            </button>

        </div>

    </div>

</body>

</html>
