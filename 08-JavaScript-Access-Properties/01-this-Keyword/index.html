<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>This Keyword</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>JavaScript this Keyword</h1>

    <p>
        Click the button and it will disappear.
    </p>

    <button onclick="hideButton(this)">
        Click Me
    </button>

    <script>

        function hideButton(button) {

            button.style.display = "none";

        }

    </script>

</body>

</html>
