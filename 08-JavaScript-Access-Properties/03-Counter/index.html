<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaScript Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .counter-box {
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        #count {
            font-size: 50px;
            font-weight: bold;
            margin: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="counter-box">

        <h1>Counter</h1>

        <div id="count">0</div>

        <button onclick="incrementCounter()">
            Count
        </button>

    </div>

    <script>

        let count = 0;

        function incrementCounter() {

            count++;

            document.getElementById("count").textContent =
                count;

        }

    </script>

</body>

</html>
