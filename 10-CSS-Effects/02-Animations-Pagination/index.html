<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Animations and Pagination</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CSS Animations</h1>

        <div class="animated-box">
            CSS Animation
        </div>


        <h2>Pagination With Spaces</h2>

        <div class="pagination spaced">
            <a href="#">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">4</a>
            <a href="#">5</a>
        </div>


        <h2>Pagination Without Spaces</h2>

        <div class="pagination no-space">
            <a href="#">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">4</a>
            <a href="#">5</a>
        </div>

    </div>

</body>

</html>
