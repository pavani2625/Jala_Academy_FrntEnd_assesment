<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Comments</title>
</head>

<body>

    <h1>JavaScript Comments</h1>

    <p id="message"></p>

    <script>

        // This is a single-line comment.
        // It is ignored by the JavaScript engine.

        /*
            This is a multiline comment.
            Multiple lines can be written here.
            JavaScript ignores all of these lines.
        */

        let message = "JavaScript comments example";

        document.getElementById("message").textContent = message;

    </script>

</body>

</html>
