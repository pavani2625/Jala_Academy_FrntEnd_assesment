<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaScript Variable Hoisting</title>
</head>

<body>

    <h1>Variable Hoisting</h1>

    <p id="result"></p>

    <script>

        // Initialization before declaration
        message = "Hello from JavaScript";

        document.getElementById("result").textContent =
            message;

        // Variable declaration
        var message;

    </script>

</body>

</html>
