<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTML5 Input Types</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>HTML5 Input Types</h1>

        <form>

            <!-- Number -->
            <div class="form-group">
                <label for="age">Age:</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age">
            </div>


            <!-- Range -->
            <div class="form-group">
                <label for="experience">
                    Experience:
                </label>

                <input
                    type="range"
                    id="experience"
                    name="experience"
                    min="0"
                    max="20"
                    value="1">
            </div>


            <!-- Color -->
            <div class="form-group">
                <label for="color">Choose Color:</label>

                <input
                    type="color"
                    id="color"
                    name="color"
                    value="#2563eb">
            </div>


            <!-- Date -->
            <div class="form-group">
                <label for="dob">Date of Birth:</label>

                <input
                    type="date"
                    id="dob"
                    name="dob">
            </div>


            <!-- File -->
            <div class="form-group">
                <label for="resume">Upload Resume:</label>

                <input
                    type="file"
                    id="resume"
                    name="resume">
            </div>


            <!-- Time -->
            <div class="form-group">
                <label for="time">Preferred Time:</label>

                <input
                    type="time"
                    id="time"
                    name="time">
            </div>


            <!-- Month -->
            <div class="form-group">
                <label for="month">Joining Month:</label>

                <input
                    type="month"
                    id="month"
                    name="month">
            </div>


            <!-- Week -->
            <div class="form-group">
                <label for="week">Preferred Week:</label>

                <input
                    type="week"
                    id="week"
                    name="week">
            </div>


            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com">
            </div>


            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</body>

</html>
