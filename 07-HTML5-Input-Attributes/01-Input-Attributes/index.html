<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTML5 Input Attributes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>HTML5 Input Attributes</h1>

        <form>

            <!-- Text -->
            <div class="form-group">
                <label for="name">Name:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name">
            </div>


            <!-- Password -->
            <div class="form-group">
                <label for="password">Password:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password">
            </div>


            <!-- Radio -->
            <div class="form-group">

                <p>Gender:</p>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="male">
                    Male
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="female">
                    Female
                </label>

            </div>


            <!-- Checkbox -->
            <div class="form-group">

                <p>Skills:</p>

                <label>
                    <input
                        type="checkbox"
                        name="skill"
                        value="java">
                    Java
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="skill"
                        value="html">
                    HTML
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="skill"
                        value="css">
                    CSS
                </label>

            </div>


            <!-- Submit -->
            <input
                type="submit"
                value="Submit">


            <!-- Reset -->
            <input
                type="reset"
                value="Reset">


            <!-- Button -->
            <input
                type="button"
                value="Click Me"
                onclick="alert('Button clicked!')">

        </form>

    </div>

</body>

</html>
